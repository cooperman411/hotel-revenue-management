name: Validate Agent Skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-skills:
    name: Validate skill metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Agent Skills reference validator
        run: |
          python -m pip install "git+https://github.com/agentskills/agentskills.git@83021e2be457a9b6679148719c1f6074f0ad975e#subdirectory=skills-ref"
      - name: Validate active skill folders
        shell: bash
        run: |
          set -euo pipefail
          skills-ref validate skills/hotel-revenue-audit
          skills-ref validate skills/hotel-rate-optimizer
